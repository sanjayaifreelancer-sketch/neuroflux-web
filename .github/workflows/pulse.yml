name: NeuroFlux Pulse Update
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatched:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with: {python-version: '3.10'}
      - name: Run Engine
        run: |
          pip install requests python-dotenv
          python engine/transformer.py
      - name: Commit and Push
        run: |
          git config user.name 'NeuroFlux Bot'
          git config user.email 'bot@neuroflux.ai'
          git add public/feed.json
          git commit -m "Automated Pulse Update" || exit 0
          git push