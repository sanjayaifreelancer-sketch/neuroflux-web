name: NeuroFlux Pulse — 5-Hour Sync
on:
  schedule:
    - cron: '0 */5 * * *'   # Every 5 hours
  workflow_dispatch:         # Manual trigger
  push:
    branches: [master]
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install feedparser lxml requests python-dotenv

      - name: Run Pulse Engine
        env:
          NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
        run: |
          python engine/pulse.py

      - name: Commit & Push Feed Update
        run: |
          git config user.name 'NeuroFlux Bot'
          git config user.email 'pulse@neuroflux.app'
          git add public/feed.json
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "⚡ Neural pulse update [$(date -u '+%Y-%m-%d %H:%M UTC')]" && \
             git push)
